<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <section class="display" id="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </section>
    <div class="keypad" id="keypad">
      <button class="btn btn-danger" data-action="clear" aria-label="Clear">C</button>
      <button class="btn btn-danger" data-action="delete" aria-label="Delete">DEL</button>
      <button class="btn btn-fn" data-action="percent" aria-label="Percent">%</button>
      <button class="btn btn-op" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

      <button class="btn" data-action="digit" data-value="7">7</button>
      <button class="btn" data-action="digit" data-value="8">8</button>
      <button class="btn" data-action="digit" data-value="9">9</button>
      <button class="btn btn-op" data-action="operator" data-value="×" aria-label="Multiply">×</button>

      <button class="btn" data-action="digit" data-value="4">4</button>
      <button class="btn" data-action="digit" data-value="5">5</button>
      <button class="btn" data-action="digit" data-value="6">6</button>
      <button class="btn btn-op" data-action="operator" data-value="-" aria-label="Subtract">−</button>

      <button class="btn" data-action="digit" data-value="1">1</button>
      <button class="btn" data-action="digit" data-value="2">2</button>
      <button class="btn" data-action="digit" data-value="3">3</button>
      <button class="btn btn-op" data-action="operator" data-value="+" aria-label="Add">+</button>

      <button class="btn btn-zero" data-action="digit" data-value="0">0</button>
      <button class="btn" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
